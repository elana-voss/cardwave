name: cardwave_embeddings

description: "Stateless on-device embeddings module: embed, token-count, chunk."

version: 0.1.0

publish_to: 'none'

environment:
  sdk: ^3.10.8

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  llamadart: 0.6.17
  logging: 1.3.0
  path: 1.9.1
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  import_lint: 0.1.6

flutter:
  assets:
    - assets/models/

# Native backend opt-in for the llamadart hook lives in the build-target
# pubspec (the root cardwave pubspec.yaml), not here. With a workspace
# plus `dependency_overrides.llamadart`, hooks.user_defines in workspace
# packages does not propagate to the native build hook; the hook then
# silently falls back to its windows-x64 default of [cpu, vulkan].
