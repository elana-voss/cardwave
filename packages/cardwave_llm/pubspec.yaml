name: cardwave_llm
description: "Stateless LLM module: chat, image, video, TTS, model discovery."
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  json_annotation: ^4.10.0

  genkit: ^0.13.0
  genkit_google_genai: ^0.2.4
  genkit_openai: ^0.3.1
  genkit_anthropic: ^0.2.4
  # 1.3.0 carries the in-flight cancel API (cancelActiveGenerations); needs
  # llamadart 0.6.13+ (ModelSource, ModelCacheEntry), which our fork now is.
  genkit_llamadart: ^1.3.0
  llamadart: ^0.6.14
  schemantic: ^0.1.1

  http: ^1.2.0
  html: ^0.15.4
  html2md: ^1.3.2
  intl: ^0.20.2
  logging: ^1.3.0
  path: ^1.9.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  import_lint: ^0.1.6

flutter:
  assets:
    - assets/llm_defaults.json
    - assets/prompts/
