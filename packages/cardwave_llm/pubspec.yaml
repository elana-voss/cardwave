name: cardwave_llm

description: "Stateless LLM module: chat, image, video, TTS, model discovery."

version: 0.1.0

publish_to: 'none'

environment:
  sdk: ^3.10.8

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  genkit: 0.14.1
  genkit_anthropic: 0.2.9
  genkit_google_genai: 0.2.9
  # 1.3.3 is the first release allowing genkit 0.14.x (leehack/genkit-llamadart#13);
  # it still carries the in-flight cancel API and needs llamadart 0.6.13+, which our
  # fork is.
  genkit_llamadart: 1.3.3
  genkit_openai: 0.3.4
  html: 0.15.6
  html2md: 1.3.2
  http: 1.6.0
  intl: 0.20.2
  json_annotation: 4.12.0
  llamadart: 0.6.17
  logging: 1.3.0
  path: 1.9.1
  schemantic: 0.2.0
  uuid: 4.5.3

dev_dependencies:
  build_runner: 2.15.0
  flutter_test:
    sdk: flutter
  import_lint: 0.1.6
  json_serializable: 6.14.0

flutter:
  assets:
    - assets/llm_defaults.json
    - assets/prompts/
