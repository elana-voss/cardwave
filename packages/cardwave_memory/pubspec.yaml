name: cardwave_memory

description: "Story-structured chat memory: the event-graph schema and its (de)serialization."

version: 0.1.0

publish_to: 'none'

environment:
  sdk: ^3.10.8

resolution: workspace

dependencies:
  cardwave_embeddings:
    path: ../cardwave_embeddings
  cardwave_emotion:
    path: ../cardwave_emotion
  cardwave_llm:
    path: ../cardwave_llm
  cardwave_retrieval:
    path: ../cardwave_retrieval
  cardwave_storage:
    path: ../cardwave_storage
  flutter:
    sdk: flutter
  json_annotation: 4.12.0
  logging: 1.3.0
  schemantic: 0.2.0
  uuid: 4.5.3

dev_dependencies:
  build_runner: 2.15.0
  flutter_test:
    sdk: flutter
  # Test-only: building a fake LlmRunner subclass needs genkit's Model/Genkit
  # for the parent constructor (the fake overrides completeStructured, so the
  # dummies are never used).
  genkit: 0.14.1
  import_lint: 0.1.6
  json_serializable: 6.14.0
