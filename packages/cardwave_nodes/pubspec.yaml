name: cardwave_nodes
description: "Character immersion engine: state model, predicates, node pool, director."
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  json_annotation: ^4.10.0
  logging: ^1.3.0
  schemantic: ^0.1.1

  cardwave_embeddings:
    path: ../cardwave_embeddings
  cardwave_llm:
    path: ../cardwave_llm
  cardwave_retrieval:
    path: ../cardwave_retrieval

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  import_lint: ^0.1.6
  # Test-only: subclassing LlmRunner to fake completeStructured needs
  # genkit's Model/Genkit for the parent constructor. The fake overrides
  # completeStructured, so the dummies are never used.
  genkit: ^0.13.0
