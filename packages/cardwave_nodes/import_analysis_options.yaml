# Forbids the package from depending on app code.
# Run via:  dart pub run import_lint

rules:
  no_app_imports:
    search_file_path_reg_exp: 'lib[\\/].*\.dart$'
    not_allow_import_reg_exps: ["package:cardwave/.*"]
    ignore_import_reg_exps: []

  src_internals_private:
    search_file_path_reg_exp: 'test[\\/].*\.dart$'
    not_allow_import_reg_exps: ["package:cardwave_nodes/src/.*"]
    ignore_import_reg_exps: []
