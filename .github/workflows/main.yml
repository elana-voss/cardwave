name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: packages/cardwave_embeddings/assets/models
          key: lfs-models-${{ hashFiles('packages/cardwave_embeddings/assets/models/**') }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Extract version
        shell: bash
        run: |
          RAW=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          MAJOR_MINOR=$(echo "$RAW" | cut -d. -f1-2)
          echo "APP_VERSION_MM=$MAJOR_MINOR" >> $GITHUB_ENV
          RAW_SAFE=${RAW//+/-}
          echo "APP_VERSION_FULL=$RAW_SAFE" >> $GITHUB_ENV

      - name: Build Windows
        run: flutter build windows --obfuscate --split-debug-info=build/windows/symbols --dart-define=APP_VERSION=${{ env.APP_VERSION_MM }}

      - name: Download Warp Packer
        run: |
          Invoke-WebRequest -Uri "https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe" -OutFile warp-packer.exe

      - name: Pack with Warp
        run: |
          .\warp-packer.exe --arch windows-x64 --input_dir build\windows\x64\runner\Release --exec cardwave.exe --output Cardwave-Windows.exe

      - name: Zip
        run: Compress-Archive -Path Cardwave-Windows.exe -DestinationPath Cardwave-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: Cardwave-Windows.zip
          retention-days: 1

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: packages/cardwave_embeddings/assets/models
          key: lfs-models-${{ hashFiles('packages/cardwave_embeddings/assets/models/**') }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      - name: Extract version
        shell: bash
        run: |
          RAW=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          MAJOR_MINOR=$(echo "$RAW" | cut -d. -f1-2)
          echo "APP_VERSION_MM=$MAJOR_MINOR" >> $GITHUB_ENV
          RAW_SAFE=${RAW//+/-}
          echo "APP_VERSION_FULL=$RAW_SAFE" >> $GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define=APP_VERSION=${{ env.APP_VERSION_MM }}

      - name: Rename
        run: mv build/app/outputs/flutter-apk/app-release.apk Cardwave-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Cardwave-Android.apk
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: packages/cardwave_embeddings/assets/models
          key: lfs-models-${{ hashFiles('packages/cardwave_embeddings/assets/models/**') }}

      # Flutter Linux desktop toolchain + plugin system deps.
      # gstreamer -> audioplayers_linux; libmpv-dev -> media_kit.
      # These are not needed by the Windows/Android jobs.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - name: Extract version
        shell: bash
        run: |
          RAW=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          MAJOR_MINOR=$(echo "$RAW" | cut -d. -f1-2)
          echo "APP_VERSION_MM=$MAJOR_MINOR" >> $GITHUB_ENV
          RAW_SAFE=${RAW//+/-}
          echo "APP_VERSION_FULL=$RAW_SAFE" >> $GITHUB_ENV

      - name: Build Linux
        run: flutter build linux --release --obfuscate --split-debug-info=build/linux/symbols --dart-define=APP_VERSION=${{ env.APP_VERSION_MM }}

      # The Linux bundle is a directory (executable + lib/*.so + data/), not a
      # single file like the Windows .exe, so ship it as a tarball. Rename the
      # bundle so it extracts into a clean `cardwave/` folder.
      - name: Package tarball
        run: |
          mv build/linux/x64/release/bundle cardwave
          tar -czf Cardwave-Linux.tar.gz cardwave

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: Cardwave-Linux.tar.gz
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-windows, build-android, build-linux]
    # Only publish a release on tag pushes. Manual workflow_dispatch runs then
    # exercise the build jobs (windows/android/linux) without creating or
    # publishing a GitHub release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-bin
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cardwave-Windows.zip
            Cardwave-Android.apk
            Cardwave-Linux.tar.gz
          generate_release_notes: true
