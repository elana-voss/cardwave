name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'packages/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract major.minor version
        shell: bash
        run: |
          RAW=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          MAJOR_MINOR=$(echo "$RAW" | cut -d. -f1-2)
          echo "APP_VERSION_MM=$MAJOR_MINOR" >> $GITHUB_ENV

      - name: Cache Flutter web build
        id: cache-web
        uses: actions/cache@v4
        with:
          path: build/web
          key: web-pwanone-${{ env.APP_VERSION_MM }}-${{ hashFiles('lib/**', 'web/**', 'pubspec.yaml', 'pubspec.lock', 'packages/**') }}

      - name: Setup Flutter
        if: steps.cache-web.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Build web (wasm)
        if: steps.cache-web.outputs.cache-hit != 'true'
        run: flutter build web --wasm --pwa-strategy=none --base-href=/ --dart-define=APP_VERSION=${{ env.APP_VERSION_MM }}

      - name: Stamp version and CNAME
        run: |
          # Substitute the current pubspec version into version.json (copied
          # from web/ into build/web by the Flutter build) so the in-app
          # updater detects new releases. release_notes ships with whatever
          # the source file declares (edit web/version.json per release).
          RAW=$(grep '^version: ' pubspec.yaml | awk '{print $2}')
          sed -i "s/\"latest_version\": \"[^\"]*\"/\"latest_version\": \"$RAW\"/" build/web/version.json
          echo app.cardwave.cc > build/web/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
