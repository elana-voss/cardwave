# Builds the Windows installer when a release is published on GitHub, and attaches it to the release; "Run
# workflow" on the Actions page builds it without a release (kept as the run's artifact for 7 days). A release's
# installer is signed with the project's key (the repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and comes with the app updater's feed latest.json (tools/release_feed.py),
# which the app reads from the latest release (desktop/tauri.conf.json, plugins.updater).
#
# First the checks that need no screen: the server's tests and the UI's module tests. The browser tests (their
# pictures differ by machine) and the desktop window's tests stay on the owner's computer (tools/check.sh).
# GitHub's cache keeps the Rust builds (Swatinem/rust-cache), the npm downloads and llama-server
# (tools/llama.py) between runs, and the Vulkan SDK, which dictation's whisper.cpp is built with. Strawberry Perl, which the runner has, builds SQLCipher's OpenSSL
# (`OPENSSL_SRC_PERL`, which the crate openssl-src reads): Git Bash's Perl fails at it. Steps run in Git Bash. A public repo's runs cost nothing; a private one's minutes count
# against the account's 2,000 free minutes a month. The feed's address is `releases/latest`, so a release is
# published as the latest, never as a pre-release, and its version is the workspace's (`Cargo.toml`).
name: Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
      CARGO_TERM_COLOR: never
      # The npm cache setup-node keeps; npm in Git Bash would otherwise use another (seen: 80 KB kept).
      npm_config_cache: C:\npm\cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      # Dictation's whisper.cpp is built with Vulkan: its headers, its loader and glslc come with the SDK, which
      # the action keeps in GitHub's cache (stripped down); it sets VULKAN_SDK. The loader (vulkan-1.dll) is
      # installed too, as the server's tests load it. whisper-rs's bindings are made by libclang, which the
      # runner's LLVM (C:\Program Files\LLVM) has.
      - uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          # The one this computer builds with.
          vulkan_version: 1.4.363.0
          install_runtime: true
          cache: true
          stripdown: true
      - uses: actions/cache@v6
        with:
          path: desktop/llama
          key: llama-${{ hashFiles('tools/llama.py') }}
      - run: npm ci --prefix web && npm ci --prefix desktop
      - name: Server tests
        working-directory: server
        run: cargo test
      - name: UI module tests
        working-directory: web
        run: npm test
      - name: Installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 7
      - name: Sign for the updater
        if: github.event_name == 'release'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign ../target/release/bundle/nsis/*.exe
      - name: Attach to the release, with the updater's feed
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          exe=$(ls target/release/bundle/nsis/*.exe)
          python tools/release_feed.py "$exe" "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$(basename "$exe")" latest.json
          gh release upload --clobber "$TAG" "$exe" "$exe.sig" latest.json
