# Builds a release's installers once, and users get exactly these: started by hand on the public repo with the tag
# (`gh workflow run installer.yml -f tag=v<version>`), it builds Windows' (job `windows`) and Linux's AppImage and
# .deb (job `linux`); then `feed` writes the app updater's feed latest.json once, an entry per installer
# (tools/release_feed.py), and puts the installers, their .sig and the feed on a draft release of that tag, its notes
# the top section of web/public/whats-new.md. The draft's files are what the installer tests run on; publishing the
# draft (`gh release edit <tag> --draft=false --latest`) builds nothing again. Installers are signed for the updater
# with the project's key (the repository secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD;
# tools/updater_sign.sh, which signs without them with a throwaway key). The app reads the feed from the latest
# release (desktop/tauri.conf.json, plugins.updater), so a release is published as the latest, never as a
# pre-release, and its version is the workspace's (`Cargo.toml`). The job `guard` refuses any other tag and a tag
# whose release is published, whose files users have (tools/release_guard.py); the upload asks it again.
#
# First the checks that need no screen: the workspace's tests (the desktop crate's too, whose build needs llama-server
# and the UI's build) and the UI's module tests. The browser tests (their pictures differ by machine) and the desktop
# window's tests stay on the owner's computer (tools/check.sh). GitHub's cache keeps the Rust builds
# (Swatinem/rust-cache), the npm downloads, llama-server (tools/llama.py) and the Vulkan SDK, which dictation's
# whisper.cpp is built with. Steps run in bash (Git Bash on Windows). A public repo's runs cost nothing; a private
# one's minutes count against the account's 2,000 free minutes a month, Windows' twice.
name: Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, v and the workspace's version (v0.3.0)
        required: true

permissions:
  contents: write

jobs:
  # Nothing is built for a tag other than v<workspace version> or a release already published (tools/release_guard.py).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_guard.py "${{ inputs.tag }}" "${{ github.repository }}"

  windows:
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Strawberry Perl, which the runner has, builds SQLCipher's OpenSSL (the crate openssl-src reads it): Git
      # Bash's Perl fails at it.
      OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
      CARGO_TERM_COLOR: never
      # The npm cache setup-node keeps; npm in Git Bash would otherwise use another (seen: 80 KB kept).
      npm_config_cache: C:\npm\cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      # Dictation's whisper.cpp is built with Vulkan: its headers, its loader and glslc come with the SDK, which
      # the action keeps in GitHub's cache (stripped down); it sets VULKAN_SDK. The loader (vulkan-1.dll) is
      # installed too, as the server's tests load it. whisper-rs's bindings are made by libclang, which the
      # runner's LLVM (C:\Program Files\LLVM) has.
      - uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          # The one this computer builds with.
          vulkan_version: 1.4.363.0
          install_runtime: true
          cache: true
          stripdown: true
      - uses: actions/cache@v6
        with:
          path: desktop/llama
          key: llama-windows-${{ hashFiles('tools/llama.py') }}
      - run: npm ci --prefix web && npm ci --prefix desktop
      - name: Workspace tests
        run: python tools/llama.py && npm --prefix web run build && cargo test --workspace
      - name: UI module tests
        working-directory: web
        run: npm test
      - name: Installer
        working-directory: desktop
        run: npm run dist
      - name: Sign for the updater
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash ../tools/updater_sign.sh ../target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe*
          retention-days: 7

  # The oldest of GitHub's Ubuntu runners on which the bundled llama-server starts (its files need GLIBC 2.34 and
  # GLIBCXX 3.4.30; the step "llama-server starts here" checks it by ldd): Ubuntu 22.04, so the AppImage and the
  # .deb run on Ubuntu 22.04 and later (and systems as new), as they link against this one's libraries.
  linux:
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      # The runner's disk holds too little for the workspace's debug and release builds (about 14 GB free; 33 GB
      # after the first four went, still full in the release build, 153): the toolchains this build never uses go.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/lib/jvm /opt/microsoft /opt/google \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby
          sudo docker image prune -a -f >/dev/null
          df -h / | tail -n 1
      # The packages WSL's copy builds with too (tools/linux.sh): Tauri's, whisper.cpp's, the bundles', the Secret Service.
      - run: sudo bash tools/linux.sh packages
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      # The same SDK as Windows' (it sets VULKAN_SDK and LD_LIBRARY_PATH to its own loader).
      - uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - uses: actions/cache@v6
        with:
          path: desktop/llama
          key: llama-linux-${{ hashFiles('tools/llama.py') }}
      - run: npm ci --prefix web && npm ci --prefix desktop
      # Without the SDK's LD_LIBRARY_PATH: the system's own libraries, as on a user's computer.
      # tools/llama.py makes desktop/llama on a cold run, so the step starts from ROOT.
      - name: llama-server starts here
        run: |
          python tools/llama.py
          cd desktop/llama
          missing=$(for f in llama-server *.so*; do env -u LD_LIBRARY_PATH ldd "$f"; done | grep "not found" || true)
          [ -z "$missing" ] || { echo "llama-server lacks: $missing"; exit 1; }
          env -u LD_LIBRARY_PATH ./llama-server --version
      # The coding tools' commands need Landlock (crates/cw-sandbox/src/linux.rs); their tests fail without it.
      - name: The kernel's sandbox
        run: uname -r && cat /sys/kernel/security/lsm && echo
      # The key's tests need a Secret Service: an unlocked throwaway gnome-keyring on a D-Bus session of its own.
      - name: Workspace tests
        run: npm --prefix web run build && dbus-run-session -- bash tools/linux.sh keyring cargo test --workspace
      - name: UI module tests
        working-directory: web
        run: npm test
      # As WSL's `tools/wsl.sh dist`: tools/linux.sh bundle, which keeps libvulkan out of the AppImage.
      - name: AppImage and .deb
        run: df -h / | tail -n 1 && bash tools/linux.sh bundle
      - name: Sign for the updater
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash ../tools/updater_sign.sh ../target/release/bundle/appimage/*.AppImage ../target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            target/release/bundle/appimage/*.AppImage*
            target/release/bundle/deb/*.deb*
          retention-days: 7

  # After both builds: the feed, once, with an entry per installer, so neither build overwrites the other's.
  feed:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: built
      - name: The updater's feed
        env:
          BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.tag }}
        run: |
          args=()
          for installer in $(find built -name '*.exe' -o -name '*.AppImage' -o -name '*.deb'); do
            args+=("$installer" "$BASE/$(basename "$installer")")
          done
          python3 tools/release_feed.py latest.json "${args[@]}"
          python3 -c "import json; print(sorted(json.load(open('latest.json'))['platforms']))"
      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: latest.json
          retention-days: 7
      # A draft of the tag, made at this run's commit unless there is one; the files replace any it holds. The guard
      # again, since the draft may have been published while the builds ran.
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release_guard.py "$TAG" "${{ github.repository }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            awk '/^# /{n++; next} n==1' web/public/whats-new.md > notes.md
            gh release create "$TAG" --repo "${{ github.repository }}" --draft --target "$GITHUB_SHA" \
              --title "Cardwave ${TAG#v}" --notes-file notes.md
          fi
          gh release upload --clobber --repo "${{ github.repository }}" "$TAG" $(find built -type f) latest.json
