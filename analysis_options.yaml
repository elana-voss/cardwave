include:
  - ../qcheck/app/lib/recommended.yaml
  - ../qcheck/app/lib/provider.yaml
  - ../qcheck/app/lib/flutter.yaml
  - ../qcheck/app/lib/pub.yaml

analyzer:
  exclude:
    - "**/*.g.dart"

# Cross-domain src/ privacy is enforced by import_lint, which uses a
# separate config file (import_analysis_options.yaml at the repo root)
# and runs as a CLI: `dart pub run import_lint` (see scripts/check_imports.bat).
# It is NOT an analyzer plugin in the v0.1.6 line we use here.

linter:
  rules:
    - avoid_print # No more console logs in production
    - unawaited_futures # Catches async bugs (qcheck's unawaited_future_in_void_context is narrower)
    - prefer_const_constructors # Keeps the UI snappy (qcheck has no equivalent)
    - cancel_subscriptions # Prevents memory leaks (qcheck has the same rule but it's not in `recommended`)
    - close_sinks # Prevents memory leaks (qcheck's dispose_class_fields covers only classes with a cleanup method)

# qcheck — Flutter/Dart code-quality analyzer (third-party).
# CLI: `..\qcheck\build\qcheck.exe analyze lib/` (no --preset flag —
# the `include:` above already selects `recommended`, so the CLI inherits it).
# In-editor: loaded as an analysis_server_plugin via the top-level `plugins:`
# block below (NOT `analyzer: plugins:` — that's the legacy mechanism).
# qcheck lives at `..\qcheck` (sibling of `cardwave/`), not inside this repo.
plugins:
  qcheck:
    path: ../qcheck/app

qcheck:
  exclude:
    - "**/*.g.dart"          # json_serializable generated code; mirrors analyzer:exclude above
    - "memory-bank/**"       # reference-code scratch files, not part of the app
    - "scripts/**"           # build/dev scripts — not app code
    - "test/**"              # unit tests at workspace root — not linted by qcheck
    - "**/test/**"           # unit tests inside member packages
    - "integration_test/**"  # UI-driven integration tests at workspace root
    - "**/integration_test/**" # UI-driven integration tests inside member packages

  disabled-rules:
    # Architecture conflicts — these rules contradict project-wide conventions.
    - prefer-nullable-provider-types # Providers are always present at scope; nullable T? defeats the contract

    # Stylistic noise — high count, low payoff, no behavioral signal.
    - prefer-shorthands-with-enums  # 1033 sites; readers see the enum name at every match arm and named-argument site — we pay verbosity for navigation. Tooling-only migration if ever reversed.
    - prefer-shorthands-with-static-fields # same readability cost — `.constName` over `MyClass.constName`
    - prefer-returning-shorthands   # same readability cost in return position
    - prefer-shorthands-with-constructors # same readability cost at construction sites

    # Convention conflicts — project uses different naming/file conventions on purpose.
    - prefer-prefixed-global-constants # shared values live in AppConstants; the few top-level consts are local-scope
    - prefer-extracting-callbacks   # from flutter-extras; contradicts CLAUDE.md "flat over nested; inline single-use private helpers"
