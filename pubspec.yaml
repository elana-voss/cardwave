name: cardwave
description: "AI Character Cards Manager."
publish_to: 'none'
version: 0.2.0

workspace:
  - packages/cardwave_llm
  - packages/cardwave_embeddings
  - packages/cardwave_names
  - packages/cardwave_storage
  - packages/cardwave_retrieval
  - packages/cardwave_emotion
  - packages/cardwave_memory
  - packages/cardwave_nodes

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  crclib: ^3.0.0
  png_chunks_extract: ^1.0.2
  json_annotation: ^4.10.0

  # The cardwave_llm package owns chat/image/video/TTS generation.
  # Genkit + html/html2md moved into the package; root keeps only what the
  # app code (outside the LLM module) consumes directly.
  cardwave_llm:
    path: packages/cardwave_llm

  # The cardwave_embeddings package owns the on-device embedder, the GGUF
  # model asset, and the chunking helper. The app's SearchService consumes
  # it via Provider.
  cardwave_embeddings:
    path: packages/cardwave_embeddings

  # The cardwave_retrieval package owns embedder-agnostic retrieval math:
  # cosine, RRF, BM25F, and the vector sidecar codec. SearchService composes
  # it with cardwave_embeddings; the package itself has no cardwave deps.
  cardwave_retrieval:
    path: packages/cardwave_retrieval

  # The cardwave_emotion package owns the embedding-similarity emotion
  # classifier (GoEmotions labels). Built on cardwave_embeddings +
  # cardwave_retrieval; no app deps. Wired into the app in a later phase.
  cardwave_emotion:
    path: packages/cardwave_emotion

  # The cardwave_storage package owns the cross-platform storage shim:
  # IndexedDB on web (via fs_shim + idb_shim), dart:io on native. Owns
  # the AppStorage facade, StorageDomainEnum, and the native-path helpers.
  cardwave_storage:
    path: packages/cardwave_storage

  # The cardwave_names package owns the tagged NPC name database + filter
  # logic backing the `suggest_name` LLM tool. The bundled JSON ships
  # inside the package; the offline generator at tools/generate_names/
  # writes back to it.
  cardwave_names:
    path: packages/cardwave_names

  # The cardwave_memory package owns the story-structured chat-memory event
  # graph: schema + (de)serialization. Built on cardwave_embeddings +
  # cardwave_retrieval + cardwave_emotion + cardwave_llm; no app deps. Wired
  # into the app in a later phase.
  cardwave_memory:
    path: packages/cardwave_memory

  # The cardwave_nodes package owns the character immersion engine: state
  # model (emotions, physical, relationship, knowledge, scene, event log),
  # node pool, predicates, firing logic, and the director LLM call. No app
  # deps. Wired into the app in a later phase.
  cardwave_nodes:
    path: packages/cardwave_nodes

  # Schema-validated tools — used both by the LLM module and by the
  # taxonomy editor in lib/character/, so it stays as a root dep too.
  schemantic: ^0.1.1

  http: ^1.2.0
  intl: ^0.20.2
  logging: ^1.3.0
  path: ^1.9.1
  markdown_widget: ^2.3.2+8
  markdown: ^7.3.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.2
  package_info_plus: ^10.0.0
  pub_semver: ^2.1.4
  diff_match_patch: ^0.4.1
  uuid: ^4.5.3
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.1
  flutter_speed_dial: ^7.0.0
  # Discontinued upstream (replaced-by → two_dimensional_scrollables, but
  # the replacement has no drag-drop reparenting / TreeIndentation, which
  # the taxonomy editor depends on). Pinned so a careless `pub upgrade`
  # doesn't surface the discontinuation noise; revisit when the official
  # TreeView grows reorder support or a maintained alternative emerges.
  flutter_fancy_tree_view: ^1.6.0
  share_plus: ^13.0.0
  audioplayers: ^6.6.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Native code editor for the nodes raw-JSON editor (bracket folding,
  # find/replace, large-document performance). re_highlight is pulled
  # transitively but declared because the JSON language and atom-one
  # theme maps are imported directly.
  re_editor: ^0.8.0
  re_highlight: ^0.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  import_lint: ^0.1.6
  # qcheck is wired as an analysis_server_plugin via the top-level `plugins:`
  # block in analysis_options.yaml; it resolves its own deps separately and
  # does NOT need to be a dev_dependency here.

# Pinned to a cardwave fork of llamadart at b9016 (upstream commit
# fc98c90b, PR #121 merge). The fork redirects the windows-x64 native
# bundle to elana-voss/llamadart-native-overrides, which ships a
# rebuilt ggml-vulkan.dll without cooperative-matrix property queries
# (works around NVIDIA Blackwell + AMD AMDVLK iGPU driver crashes).
# See app/README.md "Windows: GPU compatibility".
dependency_overrides:
  # Stable ref shipped at v0.1.1 (Vulkan native-bundle workaround, see the
  # note above). A local `path: ../../llamadart` is used transiently for
  # native patch work; releases pin the git ref.
  llamadart:
    git:
      url: https://github.com/elana-voss/llamadart.git
      ref: af4cbce20d54235dedf00dd741794cec2632a712
  # Maintained fork of re_editor: upstream (reqable/re-editor) is stale and not
  # merging fixes. Our fork carries the Flutter 3.44 onFocusReceived fix, the
  # wasm-safe isolate_manager bump (so no app-side override is needed), and a
  # find-panel listener-disposal fix. Keep the fork public for the public CI.
  re_editor:
    git:
      url: https://github.com/elana-voss/re-editor.git
      ref: 69be8c55a34972cb1523f064b588cc72f3c5db99

# Native backend opt-in for the llamadart hook. Lives in the build-target
# pubspec (this one) because workspace packages don't propagate
# `hooks.user_defines` to native build hooks. Without this, llamadart
# falls back to its default windows-x64 backends ([cpu, vulkan]).
hooks:
  user_defines:
    llamadart:
      llamadart_native_backends:
        platforms:
          windows-x64: [cpu, vulkan]

  # flutter_launcher_icons removed from regular deps to free up cli_util/analyzer
  # constraints that block import_lint. It now runs as a globally activated tool
  # via scripts\runner_ICON_and_SPLASH.bat (which also regenerates splash screens).

  # dependency_validator: ^5.0.5
  # unused_assets_removal: ^0.0.6

# llamadart's `hooks.user_defines` lives in `packages/cardwave_embeddings/`
# (the consuming pubspec) — Dart's native-asset hook system reads
# user-defines from the package that declares the dependency.

flutter:
  uses-material-design: true

  assets:
    - assets/images/default_character.png
    - assets/tags/taxonomy.json
    - branding/logo_icon.png
    - assets/cards/Cass_Assistant.png
    - assets/test_cards/Test_Character.png
    - assets/test_cards/Vietnamese_Desc_Character.png
    - assets/test_cards/Ada_Lovelace.png
    - assets/test_cards/Aria.png
    - assets/test_cards/Chester.png
    - assets/test_cards/Detective_Ryn.png
    - assets/test_cards/Julian.png
    - assets/test_cards/Nexus-7.png
    - assets/test_cards/Orion.png
    - assets/test_cards/Pip.png
    - assets/test_cards/Seraphina.png

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/NotoSans-Italic-VariableFont_wdth,wght.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "branding/logo_icon.png"
  windows:
    generate: true
    image_path: "branding/logo_icon.png"
    icon_size: 256 # Windows requires the ico file to be max 256x256
  image_path: "branding/logo_icon.png"
  # You can also set a specific background color if your icon has transparency
  # adaptive_icon_background: "#ffffff" 
  # adaptive_icon_foreground: "assets/icon_foreground.png"

flutter_native_splash:
  color: "#111418"
  color_dark: "#111418"
  image: "branding/logo_splash.png"
  fullscreen: true
  android_12:
    image: "branding/logo_splash.png"
    icon_background_color: "#111418"
    icon_background_color_dark: "#111418"
  android: true
  ios: false
  web: true
