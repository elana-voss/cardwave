# Cross-domain src/ privacy enforcement.
#
# Each domain's lib/<domain>/src/ is private. Files outside that domain
# must import via the barrel (package:cardwave/<domain>/<domain>.dart).
#
# Run via:  dart pub run import_lint
# Or:       scripts\check_imports.bat
#
# Pattern:
#   search_file_path_reg_exp matches files OUTSIDE the domain (negative
#       lookahead on the domain folder name; supports both `/` and `\`
#       separators for Windows paths)
#   not_allow_import_reg_exps lists the forbidden import shape
#   ignore_import_reg_exps documents accepted exceptions (deferred refactors)

rules:
  chat_internals_private:
    search_file_path_reg_exp: 'lib[\\/](?!chat[\\/]).*\.dart$'
    not_allow_import_reg_exps: ["package:cardwave/chat/src/.*"]
    ignore_import_reg_exps: []

  group_internals_private:
    search_file_path_reg_exp: 'lib[\\/](?!group[\\/]).*\.dart$'
    not_allow_import_reg_exps: ["package:cardwave/group/src/.*"]
    ignore_import_reg_exps: []

  character_internals_private:
