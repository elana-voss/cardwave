[env]
# ts-rs writes the TypeScript API types here when `cargo test` runs.
TS_RS_EXPORT_DIR = { value = "web/src/api/generated", relative = true }
# IDs and timestamps are 64-bit in Rust and plain numbers in JSON.
TS_RS_LARGE_INT = "number"
# A test program runs at most 4 tests at a time, for the same reason as `jobs` below.
RUST_TEST_THREADS = "4"
# Shorter folders for its Vulkan shader generator, whose default paths are too long for MSBuild (that file's head).
CMAKE_PROJECT_INCLUDE = { value = ".cargo/whisper-paths.cmake", relative = true }
# The OpenSSL that SQLCipher links in comes without its debug file (ossl_static.pdb), which MSVC's linker warns
# of (LNK4099) for every program it links; link.exe reads more options from `_LINK_`. Not as `rustflags`, whose
# change rebuilds every crate.
# Vulkan's loader (vulkan-1.dll, which whisper.cpp's Vulkan build imports) is loaded at its first call, so the
# app starts on a computer without it (`sys::has_vulkan` asks first); 4199 is the warning of every other program,
# which imports none of it.
_LINK_ = "/ignore:4099 /ignore:4199 /DELAYLOAD:vulkan-1.dll delayimp.lib"

[build]
# At most 4 jobs at a time, so a build leaves room for other work on the computer.
jobs = 4
