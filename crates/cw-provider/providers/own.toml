# The providers the account's form offers by name ("Provider" over the address of the chat model), kept by hand.
# With those of models.dev.toml they are the list the server reads (crates/cw-provider/src/list.rs), built into it.
#
#   name      as the form shows it; no two providers of the list are called the same, whatever their case
#   base_url  the address of the provider's API up to the version part, without a slash at its end: what the
#             form fills in, and so where the user's key goes. https, but for a server on the user's own machine,
#             which is http://127.0.0.1 with its port and stands apart in the form ("On this computer")
#   website   the provider's website, without "www.": who gives that domain, or a host under it, where the form
#             asks for the website of a provider that is not on the list, is given this entry. Without one, an
#             entry is found by its address's host
#   keys      how the provider's keys begin, where that is known: first run takes a key that begins so for this
#             provider's. Where a key begins as several entries say, the longest beginning counts, and among
#             entries with the same one the user chooses ("sk-" is OpenAI's older keys, DeepSeek's and Alibaba's
#             older ones)
#
# Each address of a service was asked without a key and answered as an API does (GET <base_url>/models: a list of
# models, or 401 or 403 that is no HTML) on 2026-10-13; Gemini's, which answers 404 there without a key, by its
# place for chat completions. The three servers on the user's own machine are at the ports the Flutter app names.
# A beginning of a key is the one a public scanner for leaked keys looks for, read on 2026-10-14: gitleaks'
# config/gitleaks.toml (OpenAI, Anthropic, Google, Hugging Face, Perplexity) and trufflehog's pkg/detectors (Groq,
# xAI, OpenRouter, NVIDIA, DeepSeek). Every other service, which neither scanner names by a beginning, was looked up
# in its own API docs on 2026-10-16, and a beginning is taken only where they state it, not from a placeholder:
# NanoGPT docs.nano-gpt.com/authentication, Chutes chutes.ai/llms.txt, Novita docs.novita.ai/guides/llm-api-keys,
# Alibaba alibabacloud.com/help/en/model-studio/get-api-key ("sk-ws", older "sk-"; Coding Plan's "sk-sp-" asks
# another address), Baseten's changelog of the "b10_" keys, Electron Hub docs.electronhub.ai authentication. The
# others' docs say no beginning. No key of a provider was tried.
# "Pretend model" is no service: the server answers its address itself (crates/cw-provider/src/pretend.rs).

