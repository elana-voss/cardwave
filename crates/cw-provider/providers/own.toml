# The providers the account's form offers by name ("Provider" over the address of the chat model), kept by hand.
# With those of models.dev.toml they are the list the server reads (crates/cw-provider/src/list.rs), built into it.
#
#   name      as the form shows it; no two providers of the list are called the same, whatever their case
#   base_url  the address of the provider's API up to the version part, without a slash at its end: what the
#             form fills in, and so where the user's key goes. https, but for a server on the user's own machine,
#             which is http://127.0.0.1 with its port and stands apart in the form ("On this computer")
#   website   the provider's website, without "www.": who gives that domain, or a host under it, where the form
#             asks for the website of a provider that is not on the list, is given this entry. Without one, an
#             entry is found by its address's host
#   keys      how the provider's keys begin, where that is known: first run takes a key that begins so for this
#             provider's. Where a key begins as several entries say, the longest beginning counts, and among
#             entries with the same one the user chooses ("sk-" is OpenAI's older keys, DeepSeek's and Alibaba's
#             older ones)
#   own_api   its API where it is more than OpenAI's, by which the app asks it (crates/cw-provider/src/list.rs
#             `OwnApi`): "openrouter" (pictures at /images), "nanogpt" (a list with details, picture models
#             apart, a subscription); an address on the host of base_url or under it is the provider's
#   models_dev  models.dev's key for the provider, where its entry there names no address (api), by which a
#             model's context window is read (crates/cw-provider/src/models_dev.rs `Index::window`)
#   steps     how much its models think, as its docs give it (crates/cw-provider/src/steps.rs `Table`): per step
#             (off, light, normal, deep) the fields merged into a request's body; all three levels or none (one
#             with only off keeps the switch); cannot_stop, parts of the IDs of models that cannot stop thinking;
#             only, parts of the IDs of models that take only some levels (OpenAI's pro models, as OpenRouter's
#             list of 2026-11-24 gives their supported_efforts: medium, high, xhigh, and no none).
#             Read on 2026-11-24 in: OpenAI developers.openai.com/api/docs/guides/reasoning; Gemini
#             ai.google.dev/gemini-api/docs/openai and docs/gemini-3 (2.5 Pro and every 3.x cannot stop);
#             OpenRouter openrouter.ai/docs/guides/best-practices/reasoning-tokens (it maps a level a model lacks
#             to the nearest); DeepSeek's levels as its docs name them; Qwen alibabacloud.com/help/en/model-studio/
#             deep-thinking (budget 4096 the top of its low band, 16384 the start of its top band; deep sends
#             none, so each model thinks up to its own cap, which differs per model); Anthropic platform.claude.com/docs/en/api/openai-sdk (its OpenAI form has no levels)
#   key_check where a provider whose list of models comes to anyone tells whether it takes a key (url; post =
#             true where it is asked by POST), else the key is asked at its list of models
#
# Each address of a service was asked without a key and answered as an API does (GET <base_url>/models: a list of
# models, or 401 or 403 that is no HTML) on 2026-10-13; Gemini's, which answers 404 there without a key, by its
# place for chat completions. The three servers on the user's own machine are at the ports the Flutter app names.
# A beginning of a key is the one a public scanner for leaked keys looks for, read on 2026-10-14: gitleaks'
# config/gitleaks.toml (OpenAI, Anthropic, Google, Hugging Face, Perplexity) and trufflehog's pkg/detectors (Groq,
# xAI, OpenRouter, NVIDIA, DeepSeek). Every other service, which neither scanner names by a beginning, was looked up
# in its own API docs on 2026-10-16, and a beginning is taken only where they state it, not from a placeholder:
# NanoGPT docs.nano-gpt.com/authentication, Chutes chutes.ai/llms.txt, Novita docs.novita.ai/guides/llm-api-keys,
# Alibaba alibabacloud.com/help/en/model-studio/get-api-key ("sk-ws", older "sk-"; Coding Plan's "sk-sp-" asks
# another address), Baseten's changelog of the "b10_" keys, Electron Hub docs.electronhub.ai authentication. The
# others' docs say no beginning. No key of a provider was tried.
# A key_check is from the provider's docs, each seen to answer a made-up key with 401 or 403 on 2026-11-08.
# NanoGPT's is its balance (POST): its subscription's usage refuses a working key that is not a UUID ("Malformed
# API key"), the balance took a working key and refused made-up ones.
# "Pretend model" is no service: the server answers its address itself (crates/cw-provider/src/pretend.rs).

[[provider]]
name = "KoboldCpp"
base_url = "http://127.0.0.1:5001/v1"

[[provider]]
name = "LM Studio"
base_url = "http://127.0.0.1:1234/v1"

[[provider]]
name = "Ollama"
base_url = "http://127.0.0.1:11434/v1"

[[provider]]
name = "OpenAI"
models_dev = "openai"
website = "openai.com"
keys = ["sk-proj-", "sk-svcacct-", "sk-"]
base_url = "https://api.openai.com/v1"
[provider.steps]
off = { reasoning_effort = "none" }
light = { reasoning_effort = "low" }
normal = { reasoning_effort = "medium" }
deep = { reasoning_effort = "high" }
cannot_stop = ["gpt-5-pro", "gpt-5.2-pro", "gpt-5.4-pro", "gpt-5.5-pro"]
only = { "gpt-5-pro" = ["medium", "high"], "gpt-5.2-pro" = ["medium", "high"], "gpt-5.4-pro" = ["medium", "high"], "gpt-5.5-pro" = ["medium", "high"] }

